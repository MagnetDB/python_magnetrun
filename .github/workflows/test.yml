name: Run Tests

on:
  push:
    branches:
      - main
      - rework_analysis
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ubuntu:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "python_magnetcooling[all]"
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          pytest -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: ubuntu
          fail_ci_if_error: false

  test-debian-trixie:
    name: Test on Debian Trixie
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install git and Python
        run: |
          apt-get update
          apt-get install -y git python3 python3-pip python3-venv

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Create virtualenv with system site packages
        run: |
          python3 -m venv --system-site-packages .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "python_magnetcooling[all]"
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          .venv/bin/pytest -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-debian-trixie
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: debian-trixie
          fail_ci_if_error: false
