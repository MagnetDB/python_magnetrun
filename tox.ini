[tox]
envlist = py311, py312, lint, docs

[testenv:lint]
basepython = python
deps = ruff
commands = ruff check python_magnetrun tests

[testenv:docs]
deps =
    sphinx>=4.3.0
    sphinx-rtd-theme>=1.0.0
    sphinxcontrib-mermaid>=0.9.2
    myst_parser>=0.15.0
commands = sphinx-build -W -b html docs/source docs/build/html

[testenv]
deps =
    pytest>=6.2
setenv =
    PYTHONPATH = {toxinidir}
commands = pytest tests/ {posargs}
