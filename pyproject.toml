[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python_magnetrun"
version = "0.2.0"
description = "Python MagnetRun contains utils to view and analyse Magnet runs"
license = "MIT"
keywords = ["python_magnetrun"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"}
]
readme = "README.md"
dependencies = [
    "iapws>=1.3.4",
    "lxml>=4.9.2",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "numpy>=2.2.4",
    "scipy>=1.14.1",
    "pandas>=2.2.3,<3.0",
    "nptdms>=1.7.0",
    "pint>=0.17",
    "requests>=2.32.3",
    "statsmodels>=0.14.4",
    "tabulate>=0.9.0",
    "natsort>=8.0.2",
    "nlopt>=2.7.0",
    "pytz>=2024.1",
    "python_magnetcooling[fitting]",
]

[project.optional-dependencies]
system = [
    "clawpack>=5.11.0",
    "ht>=0.1.55",
]
signal = [
    "pwlf>=2.4.0",
    "scikit-learn>=1.7.2",
    "stumpy>=1.13.0",
    "sympy>=1.11.1",
    "ruptures>=1.0.3",
    "piecewise-regression>=1.5.0",
    "pyts>=0.13.0",
    "dtaidistance>=2.3.12",
    "pyextremes>=2.3.3",
    "visidata>=3.1.1",
    "xmltodict>=0.12.0",
]
dev = [
    "pytest>=6.2",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.3",
]
doc = [
    "sphinx>=4.3.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "myst_parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/MagnetDB/python_magnetrun"

[project.scripts]
python-magnetrun = "python_magnetrun.cli:main"
srvdata-to-magnetrun = "python_magnetrun.requests.cli:main"
magnetrun-analysis = "python_magnetrun.analysis:main"
hybrid-magnetrun = "python_magnetrun.hybrid.cli:main"
magnetrun-alimconfig = "python_magnetrun.configAlims.convertxml:main"
magnetrun-pigbrother-logparser = "python_magnetrun.tdms.log_parser:main"
magnetrun-processing = "python_magnetrun.processing.cli:main"
magnetrun-field-defs = "python_magnetrun.field_defs:main"
magnetrun-site-config = "python_magnetrun.site_config:main"

[tool.setuptools.packages.find]
include = ["python_magnetrun*"]

[tool.setuptools.package-data]
python_magnetrun = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501", "W293", "F841"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
# Start lenient; tighten over time
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test-*.py"]
# norecursedirs = ["python_magnetcooling", "rustfs", "docs", "examples", "notebooks"]
addopts = "--cov=python_magnetrun --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["python_magnetrun"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
