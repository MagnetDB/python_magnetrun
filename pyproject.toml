[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python_magnetrun"
version = "0.1.0"
description = "Python MagnetRun contains utils to view and analyse Magnet runs"
license = {text = "MIT"}
keywords = ["python_magnetrun"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"}
]
readme = "README.md"
dependencies = [
    "iapws>=1.3.4",
    "lxml>=4.9.2",
    "matplotlib>=3.3.4",
    "seaborn>=0.11.1",
    "numpy>=2.2.1",
    "scipy>=1.14.1",
    "pandas>=2.2.1",
    "nptdms>=1.7.0",
    "pint>=0.17",
    "requests>=2.32.3",
    "statsmodels>=0.12.2",
    "tabulate>=0.9.0",
    "natsort>=7.1.1",
    "nlopt>=2.7.0",
]

[project.optional-dependencies]
system = [
    "clawpack>=5.11.0",
    "ht>=0.1.55",
]
signal = [
    "ruptures>=1.0.3",
    "piecewise-regression>=1.5.0",
    "pwlf>=2.4.0",
    "pyts>=0.13.0",
    "dtaidistance>=2.3.12",
    "pyextremes>=2.3.3",
    "visidata>=3.1.1",
]
dev = [
    "pytest>=6.2",
]
doc = [
    "sphinx>=4.3.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-mermaid>=0.0.1",
    "myst_parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/MagnetDB/python_magnetrun"


